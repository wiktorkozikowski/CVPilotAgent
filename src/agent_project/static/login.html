<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CVPilot: logowanie</title>
  <style>
    :root {
      --bg: #f5f6f8; --card: #ffffff; --text: #1d2330; --muted: #5b6474;
      --accent: #2456d6; --accent-text: #ffffff; --border: #d9dde5; --error: #b3261e;
    }
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        --bg: #14171d; --card: #1e232c; --text: #e7eaf0; --muted: #9aa3b2;
        --accent: #6d93ff; --accent-text: #0b1020; --border: #2f3642; --error: #ff8a80;
      }
    }
    :root[data-theme="dark"] {
      --bg: #14171d; --card: #1e232c; --text: #e7eaf0; --muted: #9aa3b2;
      --accent: #6d93ff; --accent-text: #0b1020; --border: #2f3642; --error: #ff8a80;
    }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center;
      padding: 24px 16px; background: var(--bg); color: var(--text);
      font: 16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
    form { width: 100%; max-width: 360px; padding: 28px; background: var(--card);
      border: 1px solid var(--border); border-radius: 12px; }
    h1 { margin: 0 0 4px; font-size: 1.5rem; }
    p.lead { margin: 0 0 20px; color: var(--muted); }
    label { display: block; margin: 12px 0 4px; font-weight: 600; }
    input { width: 100%; padding: 10px 12px; font: inherit; color: var(--text);
      background: var(--bg); border: 1px solid var(--border); border-radius: 8px; }
    input:focus-visible, button:focus-visible { outline: 2px solid var(--accent);
      outline-offset: 2px; }
    button { width: 100%; margin-top: 20px; padding: 10px; font: inherit; font-weight: 600;
      color: var(--accent-text); background: var(--accent); border: 0; border-radius: 8px;
      cursor: pointer; }
    button:disabled { opacity: .6; cursor: progress; }
    .msg { min-height: 1.5em; margin: 12px 0 0; color: var(--error); }
  </style>
</head>
<body>
  <form id="login" autocomplete="on">
    <h1>CVPilot</h1>
    <p class="lead">Zaloguj się, aby korzystać z agenta.</p>
    <label for="username">Login</label>
    <input id="username" name="username" autocomplete="username" required autofocus>
    <label for="password">Hasło</label>
    <input id="password" name="password" type="password" autocomplete="current-password" required>
    <button id="submit" type="submit">Zaloguj</button>
    <p id="msg" class="msg" role="alert"></p>
  </form>
  <script>
    const form = document.getElementById("login");
    const msg = document.getElementById("msg");
    const submit = document.getElementById("submit");
    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      msg.textContent = "";
      submit.disabled = true;
      try {
        const res = await fetch("/api/login", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            username: form.username.value,
            password: form.password.value,
          }),
        });
        if (res.ok) {
          window.location.replace("/");
          return;
        }
        const data = await res.json().catch(() => ({}));
        msg.textContent = data.error || "Nie udało się zalogować.";
        form.password.value = "";
        form.password.focus();
      } catch (e) {
        msg.textContent = "Brak połączenia z serwerem.";
      } finally {
        submit.disabled = false;
      }
    });
  </script>
</body>
</html>
