[project]
name = "offer-server"
version = "0.1.0"
description = "CVPilot offer server: embeds a user profile and returns matching job offers"
requires-python = ">=3.12,<3.15"
dependencies = [
    "fastembed>=0.7,<1",
    "numpy>=1.26,<3",
    "pydantic>=2.11,<3",
]

[dependency-groups]
dev = [
    "pytest>=8.4,<10",
    "ruff>=0.12,<1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["offer_server"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
